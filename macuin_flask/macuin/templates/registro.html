{% extends "base.html" %}
{% block title %}Crear Cuenta – Macuin{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h2 class="auth-title">Crear Cuenta</h2>
    <p class="auth-subtitle">Regístrate en Refaccionaria y realiza tus pedidos online.</p>

    <form method="POST" action="{{ url_for('registro') }}" class="auth-form">
      <div class="form-group">
        <label>Nombre Completo</label>
        <div class="input-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" name="nombre" placeholder="Juan Pérez" required>
        </div>
      </div>

      <div class="form-group">
        <label>Correo Electrónico</label>
        <div class="input-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <input type="email" name="email" placeholder="juan.perez@email.com" required>
        </div>
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <div class="input-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" name="password" id="password" placeholder="••••••••••" required>
          <button type="button" class="toggle-pass" onclick="togglePassword('password', this)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label>Confirmar Contraseña</label>
        <div class="input-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" name="confirmar" id="confirmar" placeholder="••••••••••" required>
        </div>
      </div>

      <div class="form-row">
        <label class="checkbox-label">
          <input type="checkbox" name="recordarme"> Recordarme
        </label>
        <a href="#" class="forgot-link">¿Olvidaste tu contraseña? ›</a>
      </div>

      <button type="submit" class="btn-primary btn-full">Crear Cuenta</button>
    </form>

    <p class="auth-footer">¿Ya tienes una cuenta? <a href="{{ url_for('login') }}">Iniciar sesión</a></p>
  </div>
</div>
{% endblock %}
